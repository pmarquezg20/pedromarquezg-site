name: Deploy pedromarquezg to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch all history for git-based timestamps
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Copy standalone apps
        # Páginas sueltas (flashcards, etc.) que no pasan por Quartz:
        # Quartz le quita la extensión a los .html de content/, así que van aparte.
        run: cp -r standalone/. public/
      - name: Add CNAME for custom domain
        # Con deploys por Actions, Pages lee el dominio del artefacto.
        # Sin este archivo el dominio queda a medias y no se emite el certificado HTTPS.
        run: echo "pedromarquezg.com" > public/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
